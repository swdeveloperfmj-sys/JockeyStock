  <body><div id="app"></div><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>{if(location.hostname==='localhost'||location.hostname==='127.0.0.1')navigator.serviceWorker.getRegistrations().then(registrations=>registrations.forEach(registration=>registration.unregister()));else navigator.serviceWorker.register('/service-worker.js')});</script></body>
